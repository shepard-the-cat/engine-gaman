name: Ingestar Capitulo a Telegram

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  subir:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar Bot de Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/subir_capitulo.js

      - name: Guardar JSON en el repositorio
        run: |
          git config user.name "MangaBot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git commit -m "chore: ingesta nuevo capitulo" || exit 0
          git push
